<!DOCTYPE html>
<html lang="sm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O le Tusi a Mamona — Interlinear</title>
<meta name="description" content="A Samoan–English interlinear Book of Mormon. Every Samoan word glossed phrase by phrase against the official English edition.">
<meta name="theme-color" content="#1B2A41">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header and footer follow the Spanish interlinear exactly: home on the
     left, the current reference as a pill that opens the contents, tools on
     the right; and a single footer row of prev / reading-mode / next.

     The pill absorbs two things that used to be separate. The title was a
     passive <h1> saying "Alema 32" while a library button beside it opened
     the contents -- the label and the way in, split apart. And it makes the
     footer's own reference control unnecessary, which is what left two
     "Alema 31 / Alema 33" rows stacked at the foot of every chapter. -->
<header class="controls-top">
  <div class="bar-group bar-left">
    <button id="btn-home" class="icon-btn" type="button" aria-label="Aiga &#183; Home">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 3.2 2.6 11.3a1 1 0 0 0 1.3 1.5l.6-.5V20a1 1 0 0 0 1 1h4.1v-5.3h4.8V21h4.1a1 1 0 0 0 1-1v-7.7l.6.5a1 1 0 0 0 1.3-1.5Z"></path></svg>
    </button>
  </div>
  <button id="nav-label" class="chapter-pill" type="button"
          aria-haspopup="dialog" aria-controls="drawer">O le Tusi a Mamona</button>
  <div class="bar-group bar-right">
    <button id="btn-settings" class="icon-btn" type="button" aria-label="Lapo&#39;a o mataitusi &#183; Text size" title="Text size">Aa</button>
    <button id="btn-theme" class="icon-btn" type="button" aria-label="Reading theme">&#9681;</button>
    <button id="btn-search" class="icon-btn" type="button" aria-label="Su&#39;e &#183; Search">&#9906;</button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<!-- Selection toolbar, mirroring WordActionBar in the app -->
<div id="actionbar" class="actionbar" hidden role="toolbar" aria-label="Selection actions">
  <div id="swatches" class="swatches"></div>
  <!-- A real eraser. This was &#9013; (U+2335 COUNTERSINK), which draws as a
       down-pointing chevron and reads as "collapse", not "erase". -->
  <button id="btn-erase" class="act-btn" aria-label="Aveese le Faailoga &#183; Erase" title="Aveese le Faailoga">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
      <path d="M8.6 20.5 3.5 15.4a1.6 1.6 0 0 1 0-2.3L12.9 3.7a1.6 1.6 0 0 1 2.3 0l5.1 5.1a1.6 1.6 0 0 1 0 2.3l-9.4 9.4z"
            fill="currentColor" opacity=".18"/>
      <path d="M8.6 20.5 3.5 15.4a1.6 1.6 0 0 1 0-2.3L12.9 3.7a1.6 1.6 0 0 1 2.3 0l5.1 5.1a1.6 1.6 0 0 1 0 2.3l-9.4 9.4z"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M8.7 8.1l7.2 7.2M8.6 20.5H20" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="act-div"></span>
  <button id="btn-underline" class="act-btn" aria-label="Vase i lalo &#183; Underline" title="Vase i lalo"><u>U</u></button>
  <button id="btn-note" class="act-btn" aria-label="Manatu" title="Manatu">&#9998;</button>
  <button id="btn-copy" class="act-btn" aria-label="Kopi" title="Kopi">&#10064;</button>
  <span class="act-spacer"></span>
  <button id="btn-clear-sel" class="act-btn" aria-label="Fa&#39;aleaoga" title="Fa&#39;aleaoga">&#10005;</button>
</div>

<!-- The reader dock. Chapter movement sits in the PRIMARY row because it is
     the thing a reader does most and it has to be reachable with a thumb; the
     mode bar is secondary and sits under it. Before this, prev/next existed
     only at the very END of a chapter, so moving on meant scrolling past
     everything you had just read or going back out to the drawer. -->
<div id="dock" class="controls-bottom" hidden>
  <button id="dock-prev" class="icon-btn" type="button" aria-label="Mataupu mu&#39;a">&#8592;</button>
  <nav id="modebar" class="mode-group" role="group" aria-label="Reader mode"></nav>
  <button id="dock-next" class="icon-btn" type="button" aria-label="Mataupu sosoo">&#8594;</button>
</div>

<!-- Per-verse note editor -->
<div id="note-sheet" class="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <span>Manatu</span>
      <button id="btn-note-close" class="chrome-btn" aria-label="Close">&times;</button>
    </div>
    <p id="note-ref" class="note-ref"></p>
    <p id="note-preview" class="note-preview"></p>
    <textarea id="note-text" rows="7" placeholder="Tusi sau manatu&hellip;"></textarea>
    <div class="note-actions">
      <button id="btn-note-delete" class="note-delete" hidden>Tapeina le Manatu</button>
      <button id="btn-note-save" class="note-save">Ua uma</button>
    </div>
  </div>
</div>

<!-- Library drawer -->
<div id="drawer-scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Library">
  <div class="drawer-head">
    <span>Tusi</span>
    <button id="btn-drawer-close" class="chrome-btn" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-filter">
    <input id="drawer-filter" type="search" autocomplete="off"
           placeholder="Su&#39;e tusi &#183; Filter books" aria-label="Filter books">
  </div>
  <div id="drawer-body"></div>
</aside>

<!-- Display settings -->
<div id="settings" class="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <span>Fa&#39;aaliga</span>
      <button id="btn-settings-close" class="chrome-btn" aria-label="Close">×</button>
    </div>
    <label class="row">
      <span>Lapo&#39;a o mataitusi</span>
      <input id="font-scale" type="range" min="0.8" max="2.0" step="0.1" value="1">
    </label>
    <label class="row">
      <span>Fa&#39;ailoga leo <small>(diacritics)</small></span>
      <input id="toggle-diacritics" type="checkbox">
    </label>
    <div class="row offline-row">
      <span>Fa&#39;aaogaina e aunoa ma le initaneti</span>
      <span id="offline-state" class="pill">…</span>
    </div>
    <p class="note" id="offline-note"></p>
  </div>
</div>

<!-- Search -->
<div id="search" class="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <span>Su&#39;e</span>
      <button id="btn-search-close" class="chrome-btn" aria-label="Close">×</button>
    </div>
    <input id="search-input" type="search" placeholder="Su&#39;e i le gagana Samoa po&#39;o le Igilisi…" autocomplete="off">
    <p class="note" id="search-note">Sa&#39;ili i upu Samoa ma fa&#39;aliliuga fa&#39;aPeretania.</p>
    <div id="search-results"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
